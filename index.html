<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>premise · decision session viewer</title>
<style>
:root{
  --bg:#0a0c0f; --panel:#0d1015; --panel2:#11151c; --panel3:#151a23;
  --line:#1c222c; --line2:#2a3341;
  --txt:#dde4ee; --txt2:#aeb9c8; --muted:#7f8b9c; --dim:#5a6474;
  --accent:#4fb8e8;
  --bound:#4cc38a; --advisory:#c9a227; --contested:#e0713f; --over:#d9534f;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-size:13px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232b36;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:#313c4a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.dim{color:var(--dim)}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

.tbar{
  display:flex;align-items:center;gap:18px;
  padding:0 14px;height:44px;
  background:linear-gradient(180deg,#101419,#0c0f14);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#eaf1fa}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.04em}
.tbar-sep{width:1px;height:20px;background:var(--line2)}
.tbar-meta{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);align-items:center}
.tbar-meta b{color:var(--txt2);font-weight:500}
.tbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid var(--line2);border-radius:3px;padding:4px 9px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt2);background:#141922;
}
.btn:hover{border-color:#3c4c5f;color:#fff;background:#18202b}
.btn.on{background:#132a35;border-color:#2b6d87;color:#9fe0f7}

.body{display:grid;grid-template-columns:288px minmax(0,1fr) 372px;min-height:0}

/* ---------- sessions ---------- */
.sessions{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.col-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 12px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
}
.sess-list{overflow-y:auto;flex:1}
.sess{
  display:block;width:100%;text-align:left;padding:10px 12px 11px;
  border-bottom:1px solid var(--line);border-left:2px solid transparent;
  position:relative;
}
.sess:hover{background:#121722}
.sess.sel{background:#151d28;border-left-color:var(--accent)}
.sess-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.sess-id{font-family:var(--mono);font-size:11px;color:var(--txt2);letter-spacing:.03em}
.dot{width:5px;height:5px;border-radius:50%;flex:none}
.dot.bound{background:var(--bound)}
.dot.mixed{background:var(--advisory)}
.dot.warn{background:var(--over)}
.sess-title{font-size:12.5px;color:#e6edf6;line-height:1.3;margin-bottom:4px}
.sess-branch{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-stats{display:flex;align-items:center;gap:8px}
.spark{display:flex;align-items:flex-end;gap:2px;height:12px;flex:1}
.spark i{flex:1;min-width:2px;background:#33404f;border-radius:1px}
.spark i.h{background:#4a7f96}
.spark i.w{background:var(--over)}
.spark i.c{background:var(--contested)}
.sess-conf{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.sess-conf b{color:var(--txt);font-weight:500}
.sess-badges{display:flex;gap:4px;margin-top:6px}
.mini{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  padding:1px 5px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);
}
.mini.warn{border-color:#5a2a24;color:#e79187;background:#1c1312}
.mini.ok{border-color:#21503c;color:#66c99b;background:#0f1a16}

/* ---------- detail ---------- */
.detail{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.det-head{padding:12px 16px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.det-row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.det-row1 h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:#f0f5fb}
.det-row1 .sid{font-family:var(--mono);font-size:11px;color:var(--accent);background:#0f222b;border:1px solid #1e4353;padding:1px 6px;border-radius:2px}
.det-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.det-meta b{color:var(--txt2);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);margin-top:11px;border-top:1px solid var(--line)}
.tile{background:var(--panel);padding:7px 10px 8px}
.tile .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.tile .v{font-family:var(--mono);font-size:15px;color:var(--txt);line-height:1.1}
.tile .v small{font-size:10px;color:var(--muted);margin-left:3px}
.tile .v.warn{color:#e88a70}
.filters{display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.filters .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-right:2px}
.fchip{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:2px;border:1px solid transparent;color:var(--muted)}
.fchip:hover{color:var(--txt)}
.fchip.on{background:#17212c;border-color:#2d3d4e;color:#dbe7f3}
.filters .r{margin-left:auto;display:flex;gap:6px}

.timeline{overflow-y:auto;padding:14px 16px 60px;position:relative}
.simbanner{
  position:sticky;top:0;z-index:5;margin:-14px -16px 12px;padding:8px 16px;
  background:#1b1410;border-bottom:1px solid #4a2a1c;color:#e9b39a;
  font-family:var(--mono);font-size:11px;display:flex;gap:10px;align-items:center;
}
.simbanner b{color:#ffd7c2;font-weight:600}
.dp{
  position:relative;border:1px solid var(--line);background:var(--panel);
  border-radius:3px;margin-bottom:10px;
}
.dp:hover{border-color:#28313d}
.dp.open{border-color:#2f3d4d;box-shadow:0 0 0 1px #1a2530}
.dp.affected{border-color:#5a3524;background:#14100e}
.dp.unbound{opacity:.42;filter:saturate(.35)}
.dp-h{display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;width:100%;text-align:left}
.seq{font-family:var(--mono);font-size:10.5px;color:var(--dim);width:18px;flex:none;text-align:right}
.rail{position:absolute;left:-1px;top:0;bottom:0;width:2px;border-radius:2px 0 0 2px}
.kind{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:1px 5px;border-radius:2px;border:1px solid;flex:none;
}
.kind.regalloc{color:#8fb8e8;border-color:#283c52;background:#101722}
.kind.inline{color:#b6a2e6;border-color:#332b4a;background:#151120}
.kind.test{color:#84c6ba;border-color:#22423c;background:#0e1a18}
.dp-t{font-size:12.5px;color:#e8eef7;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-t em{font-style:normal;color:var(--muted)}
.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 6px;border-radius:2px;border:1px solid;flex:none;
}
.chip.bound{color:#63d19e;border-color:#1f4b39;background:#0e1a15}
.chip.advisory{color:#d8b849;border-color:#4b3f18;background:#171408}
.chip.contested{color:#eda07a;border-color:#553420;background:#1a1109}
.chip.overridden{color:#e78b86;border-color:#542524;background:#1a0f0f}
.meter{width:56px;height:4px;background:#1e252f;border-radius:2px;overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:#4a7f96}
.meter.lo i{background:#a8622f}
.meter.mid i{background:#8f7a2c}
.confv{font-family:var(--mono);font-size:11px;color:var(--txt2);width:32px;text-align:right;flex:none}
.caret{width:10px;color:var(--dim);flex:none;transition:transform .12s;font-size:9px}
.dp.open .caret{transform:rotate(90deg)}
.dp-meta{padding:0 11px 8px 39px;font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;margin-top:-4px}
.dp-meta b{color:var(--muted);font-weight:500}
.dp-meta .jump{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.dp-meta .jump:hover{color:var(--accent)}

/* expanded */
.dp-body{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}
.col{padding:10px 11px;min-width:0}
.col.sent{border-right:1px solid var(--line);background:#0c0f14}
.col-h{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
}
.col-h .tag{color:#8fb8e8}
.col-h.ret .tag{color:#63d19e}
.col-h .sp{margin-left:auto;letter-spacing:0;text-transform:none;font-size:10px;color:var(--dim)}
.question{
  font-size:12px;color:var(--txt2);padding:7px 9px;margin-bottom:9px;
  border-left:2px solid #2a3542;background:#0f141b;line-height:1.4;
}
.question span{font-family:var(--mono);font-size:9.5px;color:var(--dim);display:block;margin-bottom:2px;letter-spacing:.1em;text-transform:uppercase}
.prem-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.prem{
  border:1px solid var(--line);border-radius:2px;padding:6px 8px;cursor:pointer;background:#0e1218;
  transition:border-color .1s,background .1s;
}
.prem:hover{border-color:#39506250;border-color:#375062;background:#121821}
.prem.bound-p{border-left:2px solid #2f5f4b}
.prem.bound-p:hover{border-color:#3f7f63}
.prem-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.src{
  font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  padding:0 4px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);
}
.src.profile{color:#8fb8e8;border-color:#283c52}
.src.ir{color:#b6a2e6;border-color:#332b4a}
.src.rule{color:#c9b06a;border-color:#453c22}
.src.trace{color:#84c6ba;border-color:#22423c}
.src.test{color:#8fbf7a;border-color:#2b3f25}
.src.diff{color:#9aa6b6;border-color:#333d4a}
.src.assumption{color:#e0a06f;border-color:#4a3524}
.src.verdict{color:#63d19e;border-color:#1f4b39}
.p-id{font-family:var(--mono);font-size:9.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-badge{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:auto;white-space:nowrap}
.q-badge.weak{color:#e0a06f}
.p-claim{font-size:11.5px;color:var(--txt);line-height:1.35}
.p-loc{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.advice{font-size:14px;color:#eaf2fa;line-height:1.3;margin-bottom:9px;font-weight:500}
.advice .op{color:#63d19e}
.conf-block{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.conf-big{font-family:var(--mono);font-size:19px;color:#f0f6fc;line-height:1}
.conf-big small{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.conf-block .meter{width:auto;flex:1;height:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:9px}
.kv span:nth-child(odd){color:var(--dim)}
.rationale{list-style:none;display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.rationale li{font-size:11px;color:var(--txt2);padding-left:11px;position:relative;line-height:1.35}
.rationale li:before{content:"›";position:absolute;left:1px;color:var(--dim)}
.alts{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.alt{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.alt .bar{flex:1;height:3px;background:#1b222c;border-radius:2px;overflow:hidden}
.alt .bar i{display:block;height:100%;background:#3c5f70}
.binds{border-top:1px dashed var(--line2);padding-top:8px}
.binds .bh{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.bind-as{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.bind-pill{
  font-family:var(--mono);font-size:10px;color:#63d19e;background:#0d1a14;border:1px solid #1f4b39;
  padding:1px 6px;border-radius:2px;cursor:pointer;
}
.bind-pill:hover{background:#12251c}
.cite-pill{
  font-family:var(--mono);font-size:10px;color:var(--txt2);background:#141a22;border:1px solid var(--line2);
  padding:1px 6px;border-radius:2px;cursor:pointer;
}
.cite-pill:hover{border-color:#3c5064;color:#fff}
.arts{display:flex;flex-direction:column;gap:2px}
.art{font-family:var(--mono);font-size:10px;color:var(--dim)}
.art b{color:var(--muted);font-weight:500}

/* ---------- inspector ---------- */
#insp{
  background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.insp-body{overflow-y:auto;padding:12px 13px 40px;flex:1}
.insp-empty{padding:26px 16px;color:var(--dim);font-size:12px;line-height:1.6}
.insp-empty .big{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#3f4a58;margin-bottom:8px}
.insp-id{font-family:var(--mono);font-size:11px;color:#8fb8e8;word-break:break-all}
.insp-claim{font-size:13px;color:#eef4fb;line-height:1.4;margin:7px 0 4px}
.sec{margin-top:14px}
.sec-h{
  font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  padding-bottom:5px;margin-bottom:7px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
}
.sec-h b{color:var(--txt2);font-weight:500}
.kv2{display:grid;grid-template-columns:76px 1fr;gap:3px 8px;font-family:var(--mono);font-size:10.5px}
.kv2 dt{color:var(--dim);letter-spacing:.02em}
.kv2 dd{color:var(--txt2);word-break:break-word}
.kv2 dd.hi{color:#9fd8f2}
.qual-row{display:flex;align-items:center;gap:8px;margin-top:9px}
.qual-row .meter{flex:1;width:auto;height:5px}
.qtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border-radius:2px;border:1px solid var(--line2);color:var(--muted)}
.qtag.measured{color:#63d19e;border-color:#1f4b39}
.qtag.assumed{color:#e0a06f;border-color:#4a3524}
.qtag.spec{color:#c9b06a;border-color:#453c22}
.pnote{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;border-left:2px solid var(--line2);padding-left:8px}

.cite-row{
  display:flex;align-items:center;gap:7px;padding:6px 7px;border:1px solid var(--line);
  border-radius:2px;margin-bottom:5px;cursor:pointer;background:#0e1218;
}
.cite-row:hover{border-color:#395062;background:#121821}
.cite-row .n{font-family:var(--mono);font-size:10px;color:var(--dim);width:16px;flex:none}
.cite-row .t{font-size:11.5px;color:var(--txt2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cite-row .s{font-family:var(--mono);font-size:9.5px;color:var(--dim);flex:none}
.cite-row.casc{opacity:.9}
.cite-row.casc .n{color:#c98a5e}

.imp-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:9px}
.imp-tile{background:#0e1218;padding:6px 8px}
.imp-tile .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.imp-tile .v{font-family:var(--mono);font-size:15px;color:var(--txt);line-height:1.15}
.imp-tile .v.warn{color:#e88a70}
.imp-tile .v.zero{color:#3f4a58}
.sim-btn{width:100%;margin-top:9px}
.chain{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.chain .arrow{color:var(--dim);padding-left:2px}
.chain .unb{color:#e0a06f}
.warnlist{list-style:none;display:flex;flex-direction:column;gap:3px}
.warnlist li{font-size:11px;color:var(--txt2);display:flex;gap:6px;line-height:1.35}
.warnlist li:before{content:"!";font-family:var(--mono);color:#e0a06f}

/* ---------- statusbar ---------- */
.sbar{
  height:24px;display:flex;align-items:center;gap:16px;padding:0 12px;
  background:#0c0f13;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.03em;
}
.sbar .r{margin-left:auto;display:flex;gap:14px}
.sbar b{color:var(--muted);font-weight:500}
.hl{outline:1px solid #2b6d87;outline-offset:1px}

@media (max-width:1240px){
  .body{grid-template-columns:250px minmax(0,1fr)}
  #insp{display:none}
  .body.insp-on{grid-template-columns:250px minmax(0,1fr) 340px}
  .body.insp-on #insp{display:flex}
  .tiles{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  .dp-body{grid-template-columns:1fr}
  .col.sent{border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <div class="tbar">
    <div class="brand"><b>premise</b><span>decision session viewer</span></div>
    <div class="tbar-sep"></div>
    <div class="tbar-meta">
      <span>proj <b>ravenc</b></span>
      <span>target <b>x86-64</b></span>
      <span>pipeline <b>decide-2.1</b></span>
      <span>window <b>2026-11-08 06:20 → 09:47 PT</b></span>
    </div>
    <div class="tbar-right">
      <button class="btn" id="expandAll">expand all</button>
      <button class="btn" id="collapseAll">collapse</button>
    </div>
  </div>

  <div class="body" id="body">
    <div class="sessions">
      <div class="col-head"><span>sessions</span><span id="sessCount"></span></div>
      <div class="sess-list" id="sessList"></div>
    </div>

    <div class="detail">
      <div class="det-head" id="detHead"></div>
      <div class="filters" id="filters"></div>
      <div class="timeline" id="timeline"></div>
    </div>

    <aside id="insp"></aside>
  </div>

  <div class="sbar">
    <span><b id="sb1"></b></span>
    <span>sample data · synthetic</span>
    <div class="r">
      <span id="sb2"></span>
      <span>esc to clear</span>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   SAMPLE DATA
   A decision pipeline: IDE sends decision points with premises, a pipeline
   returns an advisory verdict with a confidence, and a bound verdict becomes
   a citable premise for later decisions.
   ========================================================================= */

const PREMISES = {
  /* ---------- raw premises: S-1191 ---------- */

   STATE
   ========================================================================= */
const state = {
  session: 'S-1194',
  expanded: new Set(['d1']),
  premise: null,          // selected premise id
  filter: 'all',          // all | regalloc | inline | test | low
  simulate: null          // premise id being retracted hypothetically

const $ = (s, r) => (r || document).querySelector(s);
const byId = id => DECISIONS.find(d => d.id === id);
const prem = id => PREMISES[id];
const decsOf = sid => DECISIONS.filter(d => d.session === sid);
const sessOf = sid => SESSIONS.find(s => s.id === sid);

const KIND_LABEL = {regalloc:'register alloc', inline:'inlining', test:'test selection'};
const STATUS_LABEL = {bound:'bound', advisory:'advisory', contested:'contested', overridden:'overridden'};

function citesOf(pid){
  return DECISIONS.filter(d => d.premises.includes(pid) || (d.verdict.cites || []).includes(pid));
}
function boundCites(pid){
  return DECISIONS.filter(d => (d.verdict.cites || []).includes(pid));
}
function meterClass(c){ return c < 0.6 ? 'lo' : c < 0.75 ? 'mid' : ''; }
function pct(c){ return Math.round(c * 100); }

/* ---- blast radius: transitive walk premise -> decisions -> bound premise -> ... ---- */
function impact(pid){
  const rows = [];             // {d, viaPremise, depth, reason}
  const seenDec = new Set();
  const visitedPrem = new Set([pid]);
  const queue = [{p: pid, depth: 0, from: null}];
  while (queue.length){
    const cur = queue.shift();
    for (const d of citesOf(cur.p)){
      if (seenDec.has(d.id)) continue;
      seenDec.add(d.id);
      rows.push({d, via: cur.p, depth: cur.depth + 1, direct: cur.depth === 0});
      const b = d.verdict.binds;
      if (b && !visitedPrem.has(b)){
        visitedPrem.add(b);
        queue.push({p: b, depth: cur.depth + 1, from: d.id});
      }
    }
  }
  const sessions = new Set(rows.map(r => r.d.session));
  const artifacts = [];
  const seenArt = new Set();
  rows.forEach(r => (r.d.artifacts || []).forEach(a => {
    if (a.state === 'info' || seenArt.has(a.label)) return;
    seenArt.add(a.label);
    artifacts.push({label: a.label, state: a.state, d: r.d});
  }));
  const bindings = rows.filter(r => r.d.verdict.status !== 'overridden').length;
  return {rows, sessions: [...sessions].sort(), artifacts, bindings};
}

/* =========================================================================
   RENDER: session list
   ========================================================================= */
function sessionStats(sid){
  const ds = decsOf(sid);
  const confs = ds.map(d => d.verdict.conf);
  const mean = confs.reduce((a, b) => a + b, 0) / confs.length;
  const bound = ds.filter(d => d.verdict.status === 'bound').length;
  const contested = ds.filter(d => d.verdict.status === 'contested').length;
  const over = ds.filter(d => d.verdict.status === 'overridden').length;
  const low = ds.filter(d => d.verdict.conf < 0.7).length;
  const prem = new Set();
  ds.forEach(d => d.premises.forEach(p => prem.add(p)));
  return {ds, mean, bound, contested, over, low, min: Math.min(...confs), prefCount: prem.size};
}

function renderSessions(){
  const list = $('#sessList');
  list.innerHTML = SESSIONS.map(s => {
    const st = sessionStats(s.id);
    const dot = st.over ? 'warn' : (st.low ? 'mixed' : 'bound');
    const spark = st.ds.map(d => {
      const cls = d.verdict.status === 'overridden' ? 'w' : d.verdict.status === 'contested' ? 'c' : (d.verdict.conf >= 0.8 ? 'h' : '');
      return `<i class="${cls}" style="height:${Math.max(3, Math.round(d.verdict.conf * 12))}px" title="${d.title} · ${d.verdict.conf.toFixed(2)}"></i>`;
    }).join('');
    const badges = [];
    if (st.contested) badges.push(`<span class="mini warn">${st.contested} contested</span>`);
    if (st.over) badges.push(`<span class="mini warn">${st.over} override</span>`);
    if (!st.contested && !st.over) badges.push(`<span class="mini ok">clean</span>`);
    return `<button class="sess ${state.session === s.id ? 'sel' : ''}" data-sess="${s.id}">
      <div class="sess-top">
        <span class="dot ${dot}"></span>
        <span class="sess-id">${s.id}</span>

  }).join('');
  $('#sessCount').textContent = SESSIONS.length + ' · ' + DECISIONS.length + ' decisions';
}

function premiseRow(pid, compact){
  const p = prem(pid);

}

function decisionCard(d, simRows){
  const v = d.verdict;
  const isOpen = state.expanded.has(d.id);
  const affected = simRows ? simRows.rows.some(r => r.d.id === d.id) : false;
  const downstream = boundCites(v.binds || '');
  const sentSize = (d.premises.length * 0.42 + 0.6).toFixed(1);

  const meta = [];
  meta.push(`<span><b>${d.premises.length}</b> premises</span>`);
  if (v.binds) meta.push(`<span>bound as <span class="jump" data-prem="${v.binds}">${v.binds}</span></span>`);
  if (downstream.length) meta.push(`<span>cited by <b>${downstream.length}</b> downstream</span>`);
  if (v.cites && v.cites.length) meta.push(`<span>cites <b>${v.cites.length}</b> prior verdict${v.cites.length === 1 ? '' : 's'}</span>`);

  const body = isOpen ? `
    <div class="dp-body">
      <div class="col sent">
        <div class="col-h"><span class="tag">→ sent</span><span>IDE → pipeline</span><span class="sp">decide/1.0 · ${sentSize} kB</span></div>
        <div class="question"><span>decision point</span>${d.question}</div>
        <ul class="prem-list">${d.premises.map(p => premiseRow(p)).join('')}</ul>
        ${(v.cites || []).length ? `<div style="margin-top:8px" class="binds">
            <div class="bh">also cited as prior verdicts</div>
            <div class="bind-as">${v.cites.map(c => `<span class="bind-pill" data-prem="${c}">${c}</span>`).join('')}</div>
          </div>` : ''}
      </div>
      <div class="col ret">
        <div class="col-h ret"><span class="tag">← returned</span><span>200 ok</span><span class="sp">${v.latency}</span></div>
        <div class="advice"><span class="op">verdict:</span> ${v.advice}</div>
        <div class="conf-block">
          <div class="conf-big">${v.conf.toFixed(2)}<small>confidence</small></div>
          <span class="meter ${meterClass(v.conf)}"><i style="width:${pct(v.conf)}%"></i></span>
        </div>
        <div class="kv">
          <span>model</span><span>${v.model}</span>
          <span>ruleset</span><span>${v.ruleset}</span>
          <span>binds</span><span>${v.status === 'overridden' ? 'recorded, does not propagate' : 'propagates as premise'}</span>
        </div>
        <ul class="rationale">${v.rationale.map(r => `<li>${r}</li>`).join('')}</ul>
        <div class="alts">${v.alts.map(a => `<div class="alt"><span style="width:132px">${a.opt}</span><span class="bar"><i style="width:${pct(a.score)}%"></i></span><span>${a.score.toFixed(2)}</span></div>`).join('')}</div>
        <div class="binds">
          <div class="bh">binds downstream</div>
          ${v.binds ? `<div class="bind-as"><span class="bind-pill" data-prem="${v.binds}">${v.binds}</span>
            ${downstream.length
              ? `cited by ${downstream.map(x => `<span class="cite-pill" data-goto="${x.id}">${x.session} · ${String(x.seq).padStart(2, '0')}</span>`).join(' ')}`
              : `<span class="dim mono" style="font-size:10px">no downstream citations yet</span>`}</div>` : ''}
          <div class="arts">${(d.artifacts || []).map(a => `<div class="art"><b>${a.label}</b> · ${a.state}</div>`).join('')}</div>

  return `<article class="dp ${isOpen ? 'open' : ''} ${affected ? 'affected' : ''} ${affected && state.simulate ? 'unbound' : ''}" id="dp-${d.id}">

      <span class="seq">${String(d.seq).padStart(2, '0')}</span>

      <span class="confv">${v.conf.toFixed(2)}</span>
      <span class="caret">▶</span>
    </button>
    <div class="dp-meta">${meta.join('')}</div>
    ${body}
  </article>`;

      <div class="qual-row">
        <span class="meter ${meterClass(p.conf)}"><i style="width:${pct(p.conf)}%"></i></span>
        <span class="mono" style="font-size:11px;color:var(--txt2)">${p.conf.toFixed(2)}</span>
      </div>
      ${p.note ? `<div class="pnote">${p.note}</div>` : ''}

      <div class="sec">
        <div class="sec-h"><span>provenance</span><b>${p.src.kind}</b></div>
        <dl class="kv2">
          <dt>locator</dt><dd class="hi">${p.src.locator}</dd>
          <dt>digest</dt><dd>${p.src.digest}</dd>
          <dt>collector</dt><dd>${p.src.collector}</dd>
          <dt>commit</dt><dd>${p.src.commit}</dd>
          <dt>captured</dt><dd>${p.src.at.replace('T', ' ').replace('Z', ' UTC')}</dd>
        </dl>
      </div>

      <div class="sec">
        <div class="sec-h"><span>cited by</span><b>${im.rows.length}</b></div>
        ${citeRows}
        ${im.rows.some(r => !r.direct) ? `<div class="chain" style="margin-top:7px">${chain}</div>` : ''}
      </div>

      <div class="sec">
        <div class="sec-h"><span>retraction impact</span><b>hypothetical</b></div>
        <div class="imp-tiles">
          <div class="imp-tile"><div class="k">unbinds</div><div class="v ${im.rows.length ? 'warn' : 'zero'}">${im.rows.length}</div></div>
          <div class="imp-tile"><div class="k">sessions</div><div class="v ${im.sessions.length > 1 ? 'warn' : (im.sessions.length ? '' : 'zero')}">${im.sessions.length}</div></div>
          <div class="imp-tile"><div class="k">artifacts</div><div class="v ${im.artifacts.length ? 'warn' : 'zero'}">${im.artifacts.length}</div></div>
        </div>
        <ul class="warnlist">
          ${im.rows.filter(r => !r.direct).length ? `<li>${im.rows.filter(r => !r.direct).length} decision${im.rows.filter(r => !r.direct).length === 1 ? '' : 's'} lose support transitively through a bound verdict, not by direct citation.</li>` : ''}
          ${im.sessions.length > 1 ? `<li>Cross-session blast radius: reaches ${im.sessions.join(', ')} through ${im.rows.filter(r => !r.direct).length} bound verdict${im.rows.filter(r => !r.direct).length === 1 ? '' : 's'}.</li>` : ''}
          ${im.artifacts.length ? `<li>${im.artifacts.length} gate artifact${im.artifacts.length === 1 ? '' : 's'} would return to unverified: ${im.artifacts.slice(0, 3).map(a => a.label).join(', ')}${im.artifacts.length > 3 ? '…' : ''}</li>` : ''}
          ${!im.rows.length ? `<li style="color:var(--dim)">No decision depends on this premise. Retracting it changes nothing.</li>` : ''}
        </ul>
        <button class="btn sim-btn ${sim ? 'on' : ''}" data-sim="${state.premise}">${sim ? 'end retraction simulation' : 'simulate retraction'}</button>
        ${im.artifacts.length && sim ? `<div style="margin-top:9px" class="arts">${im.artifacts.map(a => `<div class="art">unverified · <b>${a.label}</b> (${a.d.session} · ${String(a.d.seq).padStart(2, '0')})</div>`).join('')}</div>` : ''}
      </div>
    </div>`;
}

/* =========================================================================
   STATUS BAR + EVENTS
   ========================================================================= */
function updateStatus(){
  const totalPrem = Object.keys(PREMISES).length;
  const bindings = DECISIONS.filter(d => d.verdict.binds).length;
  $('#sb1').textContent = `${SESSIONS.length} sessions · ${DECISIONS.length} decisions · ${totalPrem} premises · ${bindings} bindings`;
  $('#sb2').textContent = `selected ${state.session} · ${state.premise ? 'premise ' + state.premise : 'no premise'}`;
}

function render(){
  renderSessions();
  renderHead();
  renderFilters();
  renderTimeline();
  renderInspector();
}

function gotoDecision(id){
  const d = byId(id);
  if (!d) return;
  state.session = d.session;
  state.expanded.add(id);
  state.filter = 'all';
  render();
  const el = document.getElementById('dp-' + id);
  if (el){
    el.scrollIntoView({block:'center', behavior:'smooth'});
    el.classList.add('hl');
    setTimeout(() => el.classList.remove('hl'), 1400);
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-sess],[data-toggle],[data-prem],[data-goto],[data-filter],[data-sim],#closeInsp,#endSim,#expandAll,#collapseAll');
  if (!t) return;

  if (t.dataset.sess){ state.session = t.dataset.sess; state.simulate = null; render(); return; }
  if (t.dataset.toggle){
    const id = t.dataset.toggle;
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
    renderTimeline();
    return;
  }
  if (t.dataset.prem){
    e.stopPropagation();
    state.premise = t.dataset.prem;
    if (state.simulate && state.simulate !== state.premise) state.simulate = null;
    renderInspector();
    renderTimeline();
    return;
  }
  if (t.dataset.goto){ gotoDecision(t.dataset.goto); return; }
  if (t.dataset.filter){ state.filter = t.dataset.filter; renderFilters(); renderTimeline(); return; }
  if (t.dataset.sim){
    state.simulate = state.simulate === t.dataset.sim ? null : t.dataset.sim;
    renderInspector();
    renderTimeline();
    return;
  }
  if (t.id === 'closeInsp'){ state.premise = null; state.simulate = null; render(); return; }
  if (t.id === 'endSim'){ state.simulate = null; renderInspector(); renderTimeline(); return; }
  if (t.id === 'expandAll'){ decsOf(state.session).forEach(d => state.expanded.add(d.id)); renderTimeline(); return; }
  if (t.id === 'collapseAll'){ state.expanded.clear(); renderTimeline(); return; }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ state.premise = null; state.simulate = null; render(); }
});

render();
</script>
</body>
</html>
